<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#243761"/>
      <stop offset="100%" stop-color="#1B2A4A"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(243,245,247,0.05)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bg)"/>
  <!-- Blueprint grid texture -->
  <rect width="1200" height="600" fill="url(#grid)"/>

  <!-- Distant hills -->
  <path d="M0,400 C120,350 280,360 440,315 C600,270 760,295 920,255 C1060,220 1140,245 1200,235 L1200,600 L0,600 Z"
        fill="rgba(27,42,74,0.55)"/>
  <!-- Foreground ground -->
  <path d="M0,490 C200,468 420,475 600,480 C780,485 980,462 1200,472 L1200,600 L0,600 Z"
        fill="rgba(20,30,50,0.75)"/>

  <!-- ── Main house (left of center) ── -->
  <!-- Roof -->
  <polygon points="295,275 425,188 555,275"
           fill="rgba(243,245,247,0.07)" stroke="rgba(243,245,247,0.18)" stroke-width="1.5"/>
  <!-- Walls -->
  <rect x="310" y="275" width="230" height="170"
        fill="rgba(243,245,247,0.04)" stroke="rgba(243,245,247,0.18)" stroke-width="1.5"/>
  <!-- Window left -->
  <rect x="338" y="310" width="52" height="48"
        fill="rgba(243,245,247,0.08)" stroke="rgba(243,245,247,0.28)" stroke-width="1"/>
  <!-- Window right -->
  <rect x="458" y="310" width="52" height="48"
        fill="rgba(243,245,247,0.08)" stroke="rgba(243,245,247,0.28)" stroke-width="1"/>
  <!-- Door -->
  <rect x="405" y="370" width="40" height="75"
        fill="rgba(243,245,247,0.06)" stroke="rgba(243,245,247,0.22)" stroke-width="1"/>
  <!-- Door knob -->
  <circle cx="441" cy="408" r="3" fill="rgba(243,245,247,0.3)"/>
  <!-- Chimney -->
  <rect x="498" y="218" width="22" height="58"
        fill="rgba(243,245,247,0.06)" stroke="rgba(243,245,247,0.15)" stroke-width="1"/>
  <!-- Garage door -->
  <rect x="310" y="360" width="68" height="85"
        fill="rgba(243,245,247,0.04)" stroke="rgba(243,245,247,0.2)" stroke-width="1"/>
  <line x1="310" y1="388" x2="378" y2="388" stroke="rgba(243,245,247,0.12)" stroke-width="0.5"/>
  <line x1="310" y1="416" x2="378" y2="416" stroke="rgba(243,245,247,0.12)" stroke-width="0.5"/>
  <line x1="344" y1="360" x2="344" y2="445" stroke="rgba(243,245,247,0.12)" stroke-width="0.5"/>

  <!-- ── ADU (right of center, clearly smaller) ── -->
  <!-- Roof -->
  <polygon points="680,308 775,235 870,308"
           fill="rgba(243,245,247,0.07)" stroke="rgba(243,245,247,0.18)" stroke-width="1.5"/>
  <!-- Walls -->
  <rect x="695" y="308" width="160" height="132"
        fill="rgba(243,245,247,0.04)" stroke="rgba(243,245,247,0.18)" stroke-width="1.5"/>
  <!-- Window left -->
  <rect x="715" y="338" width="42" height="38"
        fill="rgba(243,245,247,0.08)" stroke="rgba(243,245,247,0.28)" stroke-width="1"/>
  <!-- Window right -->
  <rect x="795" y="338" width="42" height="38"
        fill="rgba(243,245,247,0.08)" stroke="rgba(243,245,247,0.28)" stroke-width="1"/>
  <!-- Door -->
  <rect x="749" y="382" width="32" height="58"
        fill="rgba(243,245,247,0.06)" stroke="rgba(243,245,247,0.22)" stroke-width="1"/>
  <!-- Door knob -->
  <circle cx="778" cy="412" r="2.5" fill="rgba(243,245,247,0.3)"/>

  <!-- ADU label tag -->
  <rect x="745" y="217" width="60" height="18" rx="2"
        fill="rgba(63,99,87,0.3)" stroke="rgba(63,99,87,0.5)" stroke-width="1"/>
  <text x="775" y="230" text-anchor="middle" font-family="monospace" font-size="9"
        fill="rgba(243,245,247,0.7)" letter-spacing="2">ADU</text>

  <!-- Utility/sewer connection line (dashed) -->
  <line x1="540" y1="420" x2="695" y2="405"
        stroke="rgba(243,245,247,0.12)" stroke-width="1" stroke-dasharray="5,4"/>
  <!-- Utility dots -->
  <circle cx="540" cy="420" r="3" fill="rgba(243,245,247,0.2)"/>
  <circle cx="695" cy="405" r="3" fill="rgba(243,245,247,0.2)"/>

  <!-- Dimension line (signature treatment) -->
  <line x1="310" y1="472" x2="870" y2="472" stroke="rgba(243,245,247,0.12)" stroke-width="0.5"/>
  <line x1="310" y1="466" x2="310" y2="478" stroke="rgba(243,245,247,0.2)" stroke-width="1"/>
  <line x1="870" y1="466" x2="870" y2="478" stroke="rgba(243,245,247,0.2)" stroke-width="1"/>
  <text x="590" y="468" text-anchor="middle" font-family="monospace" font-size="9"
        fill="rgba(243,245,247,0.2)">lot</text>

  <!-- Placeholder label bar -->
  <rect x="0" y="525" width="1200" height="75" fill="rgba(16,20,30,0.6)"/>
  <line x1="0" y1="525" x2="1200" y2="525" stroke="rgba(243,245,247,0.08)" stroke-width="0.5"/>

  <text x="600" y="552" text-anchor="middle" font-family="monospace" font-size="12"
        fill="rgba(243,245,247,0.45)" letter-spacing="6">HERO IMAGE PLACEHOLDER</text>
  <text x="600" y="572" text-anchor="middle" font-family="monospace" font-size="10"
        fill="rgba(243,245,247,0.25)" letter-spacing="1">Drop real photo → /public/images/home/hero.jpg — then update IMAGES.home.hero in src/app/lib/image-paths.ts</text>

  <!-- Verified mark -->
  <text x="600" y="590" text-anchor="middle" font-family="monospace" font-size="9"
        fill="rgba(63,99,87,0.55)" letter-spacing="3">✓ temecula-adu-services / verified blueprint</text>
</svg>
